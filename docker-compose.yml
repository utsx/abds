services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    env_file: .env.local
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_UID: ${CLICKHOUSE_UID:-1000}
      CLICKHOUSE_GID: ${CLICKHOUSE_GID:-1000}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT}:8123"
      - "127.0.0.1:${CLICKHOUSE_PORT}:9000"
    volumes:
      - ./volume:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 40
  app:
    build: .
    env_file: .env.local
    environment:
      CLICKHOUSE_HOST: clickhouse
      SERVER_PORT: ${APP_PORT}
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    volumes:
      - ./data:/app/data
    depends_on:
      clickhouse:
        condition: service_healthy
